name: Veille hybrides

# Deux passages par jour : le matin avant que l'acheteur n'ouvre l'app, et le
# soir pour rattraper les mises en ligne de la journée. Heures en UTC — la
# France est à UTC+2 l'été, UTC+1 l'hiver ; on vise « tôt le matin » sans
# chercher la minute.
#
# Attention : GitHub ne déclenche `schedule` que depuis la branche par défaut.
# Tant que ce fichier n'est pas sur `master`, seuls `workflow_dispatch` et
# `push` le lancent.
on:
  schedule:
    - cron: "20 4 * * *"     # ~06h20 à Paris l'été
    - cron: "20 16 * * *"    # ~18h20 à Paris l'été
  workflow_dispatch:          # lancement à la demande depuis l'onglet Actions
  push:
    branches:
      - master
      - claude/auction-vehicles-analytics-portal-pp0bzj
    paths: ["app/**", "etl/**", "scraper/**", ".github/workflows/veille.yml"]

permissions:
  contents: write             # pour committer les données collectées
  pages: write                # pour publier sur GitHub Pages
  id-token: write
  issues: write               # pour l'alerte « nouvel hybride »

# Deux exécutions simultanées se marcheraient sur les pieds au moment du
# commit : on laisse la plus récente terminer.
concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  collecte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Le contrôle anti-robot du site refuse une partie des pages, d'autant
      # plus depuis une adresse de centre de données. Le collecteur est
      # reprenable : chaque relance ne redemande que les pages manquantes.
      - name: Collecte des ventes ouvertes
        id: collecte
        run: |
          for tentative in 1 2 3; do
            echo "── tentative $tentative ──"
            if python3 -m etl.quotidien 2>&1 | tee sortie.txt; then
              if ! grep -qE '[1-9][0-9]* en échec' sortie.txt; then
                echo "collecte_complete=oui" >> "$GITHUB_OUTPUT"
                break
              fi
              echo "des pages manquent, on relance"
            fi
            sleep $((tentative * 20))
          done
          {
            echo 'resume<<FIN'
            sed -n '/ventes ouvertes/,$p' sortie.txt
            echo FIN
          } >> "$GITHUB_OUTPUT"

      # Une collecte partielle ne doit pas écraser des données complètes par
      # des données amputées : on ne publie que si le fichier tient debout.
      - name: Contrôle du fichier produit
        run: |
          python3 - <<'PY'
          import json, sys
          from pathlib import Path
          fichier = Path("app/data/hybrides.json")
          if not fichier.exists():
              sys.exit("app/data/hybrides.json absent — collecte échouée")
          charge = json.loads(fichier.read_text(encoding="utf-8"))
          nb = len(charge.get("lots") or [])
          if nb < 100:
              sys.exit(f"seulement {nb} hybrides — collecte manifestement partielle")
          print(f"{nb} hybrides, {charge['meta']['nb_a_venir']} à venir")
          PY

      - name: Publier les données collectées
        run: |
          git config user.name "veille-hybrides[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/data/hybrides.json data/suivi.json
          # La trajectoire des enchères s'accumule passage après passage : elle
          # n'a de valeur que conservée. Le fichier n'existe qu'une fois des
          # enchères ouvertes — son absence ne doit pas faire échouer l'étape.
          if [ -f data/trajectoires.json ]; then
            git add data/trajectoires.json
          fi
          if git diff --staged --quiet; then
            echo "aucun changement de données"
            exit 0
          fi
          git commit -m "Veille : collecte du $(date -u +%Y-%m-%d\ %H:%M) UTC"
          # Une collecte lancée à la main pendant qu'une autre tourne pousserait
          # sur un dépôt qui a bougé. On se replace au-dessus avant d'insister.
          for essai in 1 2 3; do
            git push && exit 0
            echo "poussée refusée, on se rebase et on réessaie ($essai/3)"
            git pull --rebase origin "$GITHUB_REF_NAME" || exit 1
          done
          git push

      # Un hybride ouvert à la fois : sans alerte, il faut penser à ouvrir
      # l'application. Le fichier n'existe que si un lot jamais vu correspond
      # aux critères — pas de fichier, pas de mail.
      - name: Alerte nouvel hybride
        id: alerte
        continue-on-error: true
        run: |
          if [ -f data/alerte.md ]; then
            echo "nouveaute=oui" >> "$GITHUB_OUTPUT"
            {
              echo 'corps<<FIN_ALERTE_VEILLE'
              # printf garantit le saut de ligne final : sans lui le marqueur
              # de fin se colle à la dernière ligne et l'étape échoue.
              printf '%s\n' "$(cat data/alerte.md)"
              echo 'FIN_ALERTE_VEILLE'
            } >> "$GITHUB_OUTPUT"
            echo "::notice title=Nouvel hybride::$(head -1 data/alerte.md)"
          else
            echo "nouveaute=non" >> "$GITHUB_OUTPUT"
          fi

      # GitHub notifie par mail l'ouverture d'une issue à laquelle on est
      # abonné : c'est le canal le plus fiable et il ne demande aucun secret
      # ni service tiers.
      - name: Prévenir par issue (donc par mail)
        if: steps.alerte.outputs.nouveaute == 'oui'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CORPS: ${{ steps.alerte.outputs.corps }}
        run: |
          titre=$(head -1 data/alerte.md)
          printf '%s\n' "$CORPS" > /tmp/corps.md
          gh issue create --title "🚗 $titre" --body-file /tmp/corps.md \
            --label veille 2>/dev/null \
            || gh issue create --title "🚗 $titre" --body-file /tmp/corps.md

      - name: Récapitulatif
        run: |
          {
            echo "## Veille hybrides"
            echo '```'
            cat sortie.txt | tail -25
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Tente de créer le site Pages s'il n'existe pas encore. GitHub refuse
      # cette création au jeton du workflow tant que Pages n'a jamais été
      # activé à la main : l'étape est donc facultative, et c'est le
      # déploiement qui dira si le réglage manque toujours.
      - uses: actions/configure-pages@v5
        continue-on-error: true
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app

  deploiement:
    needs: collecte
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@v4
